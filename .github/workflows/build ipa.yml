name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Archive app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project OnscreenTranslator.xcodeproj \
            -scheme OnscreenTranslator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OnscreenTranslator.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package and validate unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/OnscreenTranslator.xcarchive/Products/Applications/OnscreenTranslator.app"
          IPA_DIR="$RUNNER_TEMP/ipa"
          IPA_PATH="$RUNNER_TEMP/OnscreenTranslator-unsigned.ipa"

          test -d "$APP_PATH"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/OnscreenTranslator.app"
          (cd "$IPA_DIR" && /usr/bin/zip -qry "$IPA_PATH" Payload)
          /usr/bin/unzip -t "$IPA_PATH"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OnscreenTranslator-unsigned-ipa
          path: ${{ runner.temp }}/OnscreenTranslator-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
